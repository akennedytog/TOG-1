<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0d0d0d"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e10600"/>
      <stop offset="100%" style="stop-color:#cc0500"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)" rx="20"/>
  
  <!-- Red accent bar top -->
  <rect x="0" y="0" width="400" height="6" fill="url(#redGrad)"/>
  
  <!-- Checkered flag icon -->
  <g transform="translate(200, 80)" opacity="0.12">
    <rect x="-40" y="-20" width="10" height="10" fill="white"/>
    <rect x="-20" y="-20" width="10" height="10" fill="white"/>
    <rect x="0" y="-20" width="10" height="10" fill="white"/>
    <rect x="20" y="-20" width="10" height="10" fill="white"/>
    <rect x="40" y="-20" width="10" height="10" fill="white"/>
    <rect x="-30" y="-10" width="10" height="10" fill="white"/>
    <rect x="-10" y="-10" width="10" height="10" fill="white"/>
    <rect x="10" y="-10" width="10" height="10" fill="white"/>
    <rect x="30" y="-10" width="10" height="10" fill="white"/>
    <rect x="-40" y="0" width="10" height="10" fill="white"/>
    <rect x="-20" y="0" width="10" height="10" fill="white"/>
    <rect x="0" y="0" width="10" height="10" fill="white"/>
    <rect x="20" y="0" width="10" height="10" fill="white"/>
    <rect x="40" y="0" width="10" height="10" fill="white"/>
    <rect x="-30" y="10" width="10" height="10" fill="white"/>
    <rect x="-10" y="10" width="10" height="10" fill="white"/>
    <rect x="10" y="10" width="10" height="10" fill="white"/>
    <rect x="30" y="10" width="10" height="10" fill="white"/>
  </g>
  
  <!-- Racing helmet icon -->
  <g transform="translate(200, 130)" fill="white">
    <path d="M-35,10 C-35,-20 -20,-40 0,-40 C20,-40 35,-20 35,10 L35,15 C35,20 30,25 25,25 L-25,25 C-30,25 -35,20 -35,15 Z" fill="white"/>
    <rect x="-25" y="10" width="50" height="8" rx="2" fill="#e10600"/>
    <rect x="-15" y="-5" width="30" height="15" rx="3" fill="#e10600"/>
    <circle cx="0" cy="5" r="5" fill="#1a1a1a"/>
  </g>
  
  <!-- Red accent line -->
  <rect x="80" y="195" width="240" height="3" fill="url(#redGrad)" rx="1"/>
  
  <!-- Text: PIT ROW -->
  <text x="200" y="250" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-size="52" font-weight="900" fill="white" letter-spacing="10">PIT ROW</text>
  
  <!-- Text: MIAMI -->
  <text x="200" y="300" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-size="40" font-weight="900" fill="#e10600" letter-spacing="14">MIAMI</text>
  
  <!-- Subtitle -->
  <text x="200" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666" letter-spacing="5">PREMIUM MOTORSPORT EVENTS</text>
  
  <!-- Red accent bar bottom -->
  <rect x="0" y="394" width="400" height="6" fill="url(#redGrad)"/>
</svg>
