  <!-- Racing stripe -->
  <rect x="60" y="185" width="280" height="30" fill="url(#redGrad)" rx="2"/>
  
  <!-- Car silhouette (simplified) -->
  <g transform="translate(200, 150)" fill="white" opacity="0.9">
    <path d="M-40,15 L-50,15 L-55,5 L-50,-5 L-30,-10 L-10,-15 L10,-15 L30,-10 L50,-5 L55,5 L50,15 L40,15 Z" fill="white"/>
    <rect x="-8" y="-20" width="16" height="8" rx="3" fill="#e10600"/>
    <circle cx="-25" cy="18" r="8" fill="#333"/>
    <circle cx="25" cy="18" r="8" fill="#333"/>
    <circle cx="-25" cy="18" r="4" fill="#666"/>
    <circle cx="25" cy="18" r="4" fill="#666"/>
  </g>
  
  <!-- Text: PIT ROW -->
  <text x="200" y="240" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="48" font-weight="900" fill="white" letter-spacing="8">PIT ROW</text>
  
  <!-- Text: MIAMI -->
  <text x="200" y="285" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="36" font-weight="900" fill="#e10600" letter-spacing="12">MIAMI</text>
  
  <!-- Subtitle -->
  <text x="200" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#888" letter-spacing="4">PREMIUM EVENT SPACE</text>
  
