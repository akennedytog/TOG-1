<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    
    /* Background glow effects */
    .glow-1 {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, transparent 70%);
      top: -100px;
      right: -100px;
      border-radius: 50%;
    }
    .glow-2 {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(139,92,246,0.1) 0%, transparent 70%);
      bottom: -100px;
      left: -100px;
      border-radius: 50%;
    }
    
    /* Header */
    .header {
      position: absolute;
      top: 80px;
      text-align: center;
      z-index: 10;
    }
    .header h2 {
      color: #60a5fa;
      font-size: 36px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    
    /* Dashboard mockup */
    .dashboard {
      width: 900px;
      background: rgba(30, 41, 59, 0.9);
      border: 2px solid rgba(148, 163, 184, 0.3);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      z-index: 10;
    }
    
    /* Top bar */
    .top-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
    }
    .logo-box {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .title h3 {
      color: white;
      font-size: 28px;
      font-weight: 700;
    }
    .title p {
      color: #94a3b8;
      font-size: 14px;
    }
    
    /* Metrics grid */
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }
    .metric-card {
      background: rgba(15, 23, 42, 0.8);
      border-radius: 16px;
      padding: 24px;
      border-left: 4px solid;
    }
    .metric-card.blue { border-color: #3b82f6; }
    .metric-card.purple { border-color: #8b5cf6; }
    .metric-card.green { border-color: #10b981; }
    .metric-label {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .metric-value {
      color: white;
      font-size: 42px;
      font-weight: 800;
      font-family: 'SF Mono', Monaco, monospace;
    }
    .metric-sub {
      color: #64748b;
      font-size: 12px;
      margin-top: 4px;
    }
    
    /* Agents section */
    .agents-header {
      color: #60a5fa;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .agents-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .agent-card {
      background: rgba(30, 41, 59, 0.8);
      border: 2px solid;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }
    .agent-card.active { border-color: #10b981; }
    .agent-card.idle { border-color: #f59e0b; }
    .agent-icon {
      font-size: 28px;
      margin-bottom: 8px;
    }
    .agent-name {
      color: white;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .agent-status {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      display: inline-block;
    }
    .agent-status.active {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
    }
    .agent-status.idle {
      background: rgba(245, 158, 11, 0.2);
      color: #f59e0b;
    }
    
    /* Labels at bottom */
    .labels {
      position: absolute;
      bottom: 100px;
      width: 100%;
      padding: 0 60px;
      z-index: 10;
    }
    .label {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      background: rgba(0,0,0,0.4);
      padding: 16px 24px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }
    .label-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .label-dot.arlo { background: #3b82f6; }
    .label-dot.dante { background: #8b5cf6; }
    .label-dot.iris { background: #10b981; }
    .label-text {
      color: white;
      font-size: 28px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>
  
  <div class="header">
    <h2>Mission Control</h2>
  </div>
  
  <div class="dashboard">
    <div class="top-bar">
      <div class="logo-box">🚀</div>
      <div class="title">
        <h3>Mission Control</h3>
        <p>The One Group • AI Automation Dashboard</p>
      </div>
    </div>
    
    <div class="metrics">
      <div class="metric-card blue">
        <div class="metric-label">Total Leads</div>
        <div class="metric-value">514</div>
        <div class="metric-sub">+20 today</div>
      </div>
      <div class="metric-card purple">
        <div class="metric-label">Content Pieces</div>
        <div class="metric-value">75</div>
        <div class="metric-sub">Generated</div>
      </div>
      <div class="metric-card green">
        <div class="metric-label">Agents Active</div>
        <div class="metric-value">8</div>
        <div class="metric-sub">24/7 Operation</div>
      </div>
    </div>
    
    <div class="agents-header">Active Agents</div>
    <div class="agents-grid">
      <div class="agent-card active">
        <div class="agent-icon">🔍</div>
        <div class="agent-name">Arlo</div>
        <div class="agent-status active">Active</div>
      </div>
      <div class="agent-card active">
        <div class="agent-icon">✍️</div>
        <div class="agent-name">Dante</div>
        <div class="agent-status active">Active</div>
      </div>
      <div class="agent-card idle">
        <div class="agent-icon">📧</div>
        <div class="agent-name">Iris</div>
        <div class="agent-status idle">Idle</div>
      </div>
      <div class="agent-card active">
        <div class="agent-icon">✅</div>
        <div class="agent-name">Abby</div>
        <div class="agent-status active">Active</div>
      </div>
    </div>
  </div>
  
  <div class="labels">
    <div class="label">
      <div class="label-dot arlo"></div>
      <div class="label-text">Arlo finds leads</div>
    </div>
    <div class="label">
      <div class="label-dot dante"></div>
      <div class="label-text">Dante writes content</div>
    </div>
    <div class="label">
      <div class="label-dot iris"></div>
      <div class="label-text">Iris handles outreach</div>
    </div>
  </div>
</body>
</html>
