<!-- Email Capture Popup -->
<div id="email-popup" class="fixed inset-0 z-50 hidden" style="background: rgba(0,0,0,0.5);">
  <div class="flex items-center justify-center min-h-screen px-4">
    <div class="bg-white dark:bg-gray-800 rounded-2xl p-8 max-w-md w-full shadow-2xl relative" data-aos="zoom-in">
      <button onclick="closeEmailPopup()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
      
      <div class="text-center mb-6">
        <div class="w-16 h-16 gradient-bg rounded-full flex items-center justify-center mx-auto mb-4">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
        </div>
        <h3 class="font-display text-2xl font-bold mb-2">Get AI Automation Tips</h3>
        <p class="text-gray-600 dark:text-gray-400">Weekly insights on building your AI agent system. No spam.</p>
      </div>
      
      <form id="email-form" class="space-y-4" onsubmit="submitEmail(event)">
        <div>
          <label class="block text-sm font-medium mb-1">Email</label>
          <input type="email" id="email-input" required class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 focus:ring-2 focus:ring-primary-500" placeholder="you@company.com">
        </div>
        <button type="submit" class="w-full py-3 gradient-bg text-white font-semibold rounded-lg hover:opacity-90 transition">
          Subscribe
        </button>
      </form>
      
      <p class="text-xs text-gray-500 text-center mt-4">Unsubscribe anytime. We respect your privacy.</p>
    </div>
  </div>
</div>

<script>
// Show popup after 30 seconds or on scroll
let popupShown = false;

function showEmailPopup() {
  if (popupShown || localStorage.getItem('emailPopupDismissed')) return;
  document.getElementById('email-popup').classList.remove('hidden');
  popupShown = true;
  trackEvent('Email Popup Shown');
}

function closeEmailPopup() {
  document.getElementById('email-popup').classList.add('hidden');
  localStorage.setItem('emailPopupDismissed', 'true');
}

function submitEmail(e) {
  e.preventDefault();
  const email = document.getElementById('email-input').value;
  
  // Send to your email service (Mailchimp, ConvertKit, etc.)
  // Placeholder - replace with actual integration
  console.log('Email captured:', email);
  
  trackEvent('Email Subscribed', { page: window.location.pathname });
  
  // Show success
  document.getElementById('email-form').innerHTML = `
    <div class="text-center py-4">
      <svg class="w-12 h-12 text-green-500 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
      <p class="font-semibold text-lg">Thanks for subscribing!</p>
      <p class="text-gray-600">Check your inbox for the welcome email.</p>
    </div>
  `;
  
  setTimeout(closeEmailPopup, 2000);
}

// Show after 30 seconds
setTimeout(showEmailPopup, 30000);

// Show on scroll (50% of page)
window.addEventListener('scroll', function() {
  if (window.scrollY > document.body.scrollHeight * 0.5) {
    showEmailPopup();
  }
}, { once: true });
</script>
