<body class="min-h-screen bg-slate-950 text-slate-100">
  <nav class="fixed top-0 left-0 right-0 z-50 bg-white/90 dark:bg-gray-900/90 backdrop-blur-md border-b border-gray-200 dark:border-gray-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <a href="/" class="font-bold text-xl bg-gradient-to-r from-blue-500 to-purple-600 bg-clip-text text-transparent">The One Group</a>
        <div class="hidden md:flex items-center space-x-6">
          <a class='text-gray-600 dark:text-gray-300 hover:text-blue-600 transition' href='/about'>About</a>
          <a class='text-gray-600 dark:text-gray-300 hover:text-blue-600 transition' href='/pricing'>Pricing</a>
          <a class='text-gray-600 dark:text-gray-300 hover:text-blue-600 transition' href='/contact'>Contact</a>
          <a class='bg-gradient-to-r from-blue-500 to-purple-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:opacity-90' href='/free-ai-audit'>Free Audit</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-3xl mx-auto px-4 pt-28 pb-16">
    <h1 class="text-4xl font-bold mb-4">Contact Us</h1>
    <p class="text-slate-400 mb-10">Prefer email? Reach out directly at <a href="mailto:akennedy@theonegroup.info" class="text-blue-400 hover:underline">akennedy@theonegroup.info</a></p>

    <form id="contact-form" class="space-y-6">
      <div>
        <label class="block text-sm font-medium mb-2">Name *</label>
        <input type="text" name="name" required class="w-full rounded-lg border border-slate-700 bg-slate-900 px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Your name">
      </div>

      <div>
        <label class="block text-sm font-medium mb-2">Email *</label>
        <input type="email" name="email" required class="w-full rounded-lg border border-slate-700 bg-slate-900 px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="you@company.com">
      </div>

      <div>
        <label class="block text-sm font-medium mb-2">Subject</label>
        <input type="text" name="subject" class="w-full rounded-lg border border-slate-700 bg-slate-900 px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="What's this about?">
      </div>

      <div>
        <label class="block text-sm font-medium mb-2">Message *</label>
        <textarea name="message" required rows="5" class="w-full rounded-lg border border-slate-700 bg-slate-900 px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Tell us about your project..."></textarea>
      </div>

      <div aria-hidden="true" style="position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden;">
        <label for="website">Website</label>
        <input id="website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <button type="submit" class="w-full gradient-bg hover:opacity-90 text-white font-bold py-4 rounded-lg transition text-lg">Send Message →</button>
    </form>

    <div id="success" class="hidden text-center py-10">
      <div class="text-5xl mb-4">✅</div>
      <h2 class="text-2xl font-bold mb-3">Message sent</h2>
      <p class="text-slate-300">Thanks for reaching out. Alec will get back to you within 24 hours.</p>
    </div>
  </main>

  <footer class="py-12 border-t border-gray-800">
    <div class="max-w-6xl mx-auto px-4 text-center text-sm text-slate-500">
      <p>© 2026 The One Group. All rights reserved.<div class="mt-2"> <a href="https://x.com/TheOneGroupAI" target="_blank" rel="noopener noreferrer" class="text-gray-500 dark:text-gray-400 hover:text-blue-500 transition text-sm">@TheOneGroupAI <span class="text-xs">↗</span></a> </div></p>
    </div>
  </footer>

  <script>
    (function () {
      var form = document.getElementById('contact-form');
      var success = document.getElementById('success');
      if (!form) return;
      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        var button = form.querySelector('button[type="submit"]');
        if (button) { button.disabled = true; button.textContent = 'Sending…'; }
        var data = Object.fromEntries(new FormData(form));
        data.form_type = 'contact';
        try {
          var response = await fetch('/api/leads', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
          });
          var result = await response.json();
          if (!response.ok || !result.success) throw new Error(result.message || 'Submission failed');
          form.classList.add('hidden');
          success.classList.remove('hidden');
        } catch (error) {
          console.error('Contact submission failed:', error);
          alert('We could not send your message right now. Please try again or email us directly.');
        } finally {
          if (button) { button.disabled = false; button.textContent = 'Send Message →'; }
        }
      });
    })();
  </script>
