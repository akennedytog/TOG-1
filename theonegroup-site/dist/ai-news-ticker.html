<!-- AI News Ticker - Auto-updated daily -->
<section style="background:#ffffff;border-top:3px solid #2563eb;border-bottom:3px solid #2563eb;">
  <div style="max-width:1200px;margin:0 auto;padding:24px 16px;">
    
    <!-- Header -->
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
      <span style="display:flex;align-items:center;gap:6px;">
        <span style="display:inline-block;width:10px;height:10px;background:#2563eb;border-radius:50%;"></span>
        <span style="font-size:13px;font-weight:700;color:#1e40af;text-transform:uppercase;letter-spacing:0.05em;">AI News Today</span>
      </span>
      <span style="font-size:12px;color:#6b7280;font-weight:500;" id="ticker-date"></span>
    </div>

    <!-- Articles -->
    <div id="ai-news-ticker">
      <div style="display:flex;align-items:center;gap:8px;font-size:14px;color:#6b7280;">
        <svg style="animation:spin 1s linear infinite;width:16px;height:16px;" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" opacity="0.25"/>
          <path fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" opacity="0.75"/>
        </svg>
        Loading latest AI news...
      </div>
    </div>

    <!-- Footer link -->
    <div style="margin-top:12px;font-size:12px;">
      <a href="/blog" style="color:#2563eb;font-weight:600;text-decoration:underline;text-underline-offset:2px;">Read our analysis →</a>
    </div>
  </div>
</section>

<style>
@keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
</style>

<script>
document.getElementById('ticker-date').textContent = new Date().toLocaleDateString('en-US', { 
  weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' 
});

fetch('/ai-news.json')
  .then(r => r.json())
  .then(data => {
    var container = document.getElementById('ai-news-ticker');
    if (!data.articles || data.articles.length === 0) {
      container.innerHTML = '<div style="font-size:14px;color:#6b7280;">No news today. Check back tomorrow.</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < data.articles.length; i++) {
      var a = data.articles[i];
      var num = (i + 1).toString().padStart(2, '0');
      html += '<a href="' + a.url + '" target="_blank" rel="noopener noreferrer" style="display:block;padding:12px;margin-bottom:6px;border-radius:8px;background:#f9fafb;border:1px solid #e5e7eb;text-decoration:none;transition:all 0.15s;" onmouseover="this.style.background=\'#eff6ff\';this.style.borderColor=\'#93c5fd\';" onmouseout="this.style.background=\'#f9fafb\';this.style.borderColor=\'#e5e7eb\';">';
      html += '<div style="display:flex;align-items:flex-start;gap:10px;">';
      html += '<span style="font-size:12px;font-family:monospace;color:#93c5fd;font-weight:700;flex-shrink:0;margin-top:2px;">' + num + '</span>';
      html += '<div style="min-width:0;">';
      html += '<div style="font-size:14px;font-weight:600;color:#111827;line-height:1.4;">' + a.title + '</div>';
      html += '<div style="font-size:12px;color:#6b7280;margin-top:4px;font-weight:500;">' + a.source + ' · ' + (a.time || 'Today') + '</div>';
      html += '</div></div></a>';
    }
    container.innerHTML = html;
  })
  .catch(function(err) {
    document.getElementById('ai-news-ticker').innerHTML = '<div style="font-size:14px;color:#6b7280;">Unable to load news. Refresh to try again.</div>';
  });
</script>
