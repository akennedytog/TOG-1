<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Invisible Automation Principle - Twitter Header</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0a0f0e;
      font-family: 'Inter', sans-serif;
    }
    
    .card {
      width: 1200px;
      height: 675px;
      background: linear-gradient(145deg, #0f172a 0%, #1e293b 30%, #059669 70%, #10b981 100%);
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px;
      box-shadow: 0 50px 100px -20px rgba(5, 150, 105, 0.3);
    }
    
    /* Subtle glow effect */
    .card::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    
    /* Floating particles */
    .particles {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      animation: float 8s ease-in-out infinite;
    }
    
    .particle:nth-child(1) { width: 6px; height: 6px; top: 20%; left: 15%; animation-delay: 0s; }
    .particle:nth-child(2) { width: 10px; height: 10px; top: 60%; left: 10%; animation-delay: 1s; }
    .particle:nth-child(3) { width: 4px; height: 4px; top: 30%; right: 20%; animation-delay: 2s; }
    .particle:nth-child(4) { width: 8px; height: 8px; top: 70%; right: 15%; animation-delay: 3s; }
    .particle:nth-child(5) { width: 12px; height: 12px; top: 15%; right: 30%; animation-delay: 4s; }
    .particle:nth-child(6) { width: 6px; height: 6px; bottom: 25%; left: 25%; animation-delay: 5s; }
    .particle:nth-child(7) { width: 8px; height: 8px; top: 45%; left: 5%; animation-delay: 6s; }
    .particle:nth-child(8) { width: 5px; height: 5px; bottom: 35%; right: 8%; animation-delay: 7s; }
    
    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0); opacity: 0.3; }
      25% { transform: translateY(-20px) translateX(10px); opacity: 0.6; }
      50% { transform: translateY(-10px) translateX(-5px); opacity: 0.4; }
      75% { transform: translateY(-30px) translateX(15px); opacity: 0.5; }
    }
    
    /* Connection lines - automation flow */
    .flow-lines {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    
    .flow-line {
      position: absolute;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), rgba(255,255,255,0.3), rgba(255,255,255,0.1), transparent);
      animation: flow 4s ease-in-out infinite;
    }
    
    .flow-line:nth-child(1) {
      width: 300px;
      top: 35%;
      left: 5%;
      animation-delay: 0s;
    }
    
    .flow-line:nth-child(2) {
      width: 250px;
      top: 55%;
      right: 8%;
      animation-delay: 1s;
    }
    
    .flow-line:nth-child(3) {
      width: 200px;
      top: 75%;
      left: 15%;
      animation-delay: 2s;
    }
    
    .flow-line:nth-child(4) {
      width: 280px;
      top: 25%;
      right: 10%;
      animation-delay: 3s;
    }
    
    @keyframes flow {
      0%, 100% { opacity: 0.2; transform: translateX(0); }
      50% { opacity: 0.5; transform: translateX(20px); }
    }
    
    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      color: white;
    }
    
    .icon {
      font-size: 80px;
      margin-bottom: 25px;
      opacity: 0.9;
      filter: drop-shadow(0 10px 30px rgba(0,0,0,0.3));
    }
    
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      padding: 10px 24px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 30px;
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.9);
    }
    
    .title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 58px;
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 25px;
      text-shadow: 0 4px 40px rgba(0,0,0,0.4);
    }
    
    .title span {
      background: linear-gradient(135deg, #fff 0%, #6ee7b7 50%, #34d399 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .subtitle {
      font-size: 22px;
      font-weight: 400;
      opacity: 0.85;
      max-width: 750px;
      line-height: 1.5;
      margin: 0 auto;
      color: rgba(255,255,255,0.9);
    }
    
    .features {
      display: flex;
      justify-content: center;
      gap: 50px;
      margin-top: 50px;
    }
    
    .feature {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.08);
      padding: 16px 28px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
    }
    
    .feature-icon {
      font-size: 24px;
    }
    
    .feature-text {
      font-size: 15px;
      font-weight: 600;
      color: rgba(255,255,255,0.95);
      letter-spacing: 0.3px;
    }
    
    .logo {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 700;
      opacity: 0.5;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.7);
    }
    
    /* Ghost/emerald accent */
    .accent-circle {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(110, 231, 183, 0.2);
      animation: pulse-glow 6s ease-in-out infinite;
    }
    
    .accent-circle:nth-child(1) {
      width: 400px;
      height: 400px;
      top: -100px;
      right: -100px;
      animation-delay: 0s;
    }
    
    .accent-circle:nth-child(2) {
      width: 300px;
      height: 300px;
      bottom: -80px;
      left: -80px;
      animation-delay: 3s;
    }
    
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }
  </style>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/TOG-Logo-New.png">
</head>
<body>
  <div class="card">
    <div class="accent-circle"></div>
    <div class="accent-circle"></div>
    
    <div class="particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>
    
    <div class="flow-lines">
      <div class="flow-line"></div>
      <div class="flow-line"></div>
      <div class="flow-line"></div>
      <div class="flow-line"></div>
    </div>
    
    <div class="content">
      <div class="icon">👻</div>
      
      <div class="badge">Strategy</div>
      
      <h1 class="title">
        The <span>Invisible</span>
        <br>Automation Principle
      </h1>
      
      <p class="subtitle">The best AI automation isn't the one you notice. It's the one that just works—seamlessly, quietly, invisibly.</p>
      
      <div class="features">
        <div class="feature">
          <span class="feature-icon">⚡</span>
          <span class="feature-text">Works in Background</span>
        </div>
        <div class="feature">
          <span class="feature-icon">🎯</span>
          <span class="feature-text">Adapts to You</span>
        </div>
        <div class="feature">
          <span class="feature-icon">✨</span>
          <span class="feature-text">Feels Like Magic</span>
        </div>
      </div>
    </div>
    
    <div class="logo">THE ONE GROUP</div>
  </div>
</body>
</html>
