<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Building an AI Business - Twitter Header</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0a0a0f;
      font-family: 'Inter', sans-serif;
    }
    
    .card {
      width: 1200px;
      height: 675px;
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 25%, #7c3aed 75%, #a855f7 100%);
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px;
      box-shadow: 0 50px 100px -20px rgba(124, 58, 237, 0.4);
    }
    
    /* Abstract circuit pattern */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 80%, rgba(255,255,255,0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255,255,255,0.08) 0%, transparent 40%),
        radial-gradient(circle at 60% 70%, rgba(251, 191, 36, 0.15) 0%, transparent 30%);
      pointer-events: none;
    }
    
    /* Grid lines */
    .grid {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }
    
    /* Floating dots */
    .dots {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    
    .dot {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
    }
    
    .dot:nth-child(1) { width: 8px; height: 8px; top: 15%; left: 10%; }
    .dot:nth-child(2) { width: 12px; height: 12px; top: 25%; right: 15%; }
    .dot:nth-child(3) { width: 6px; height: 6px; bottom: 20%; left: 20%; }
    .dot:nth-child(4) { width: 10px; height: 10px; bottom: 30%; right: 25%; }
    .dot:nth-child(5) { width: 14px; height: 14px; top: 60%; left: 8%; }
    .dot:nth-child(6) { width: 8px; height: 8px; top: 10%; left: 50%; }
    
    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      color: white;
    }
    
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      padding: 10px 20px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 30px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    
    .badge::before {
      content: '';
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.2); }
    }
    
    .title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 64px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 20px;
      text-shadow: 0 4px 30px rgba(0,0,0,0.3);
    }
    
    .title span {
      background: linear-gradient(135deg, #fff 0%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .subtitle {
      font-size: 24px;
      font-weight: 400;
      opacity: 0.9;
      margin-bottom: 50px;
      max-width: 800px;
      line-height: 1.4;
    }
    
    .stats {
      display: flex;
      justify-content: center;
      gap: 60px;
      margin-top: 20px;
    }
    
    .stat {
      text-align: center;
      position: relative;
    }
    
    .stat:not(:last-child)::after {
      content: '';
      position: absolute;
      right: -30px;
      top: 50%;
      transform: translateY(-50%);
      width: 1px;
      height: 50px;
      background: rgba(255,255,255,0.2);
    }
    
    .stat-number {
      font-size: 56px;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 8px;
      font-family: 'Space Grotesk', sans-serif;
    }
    
    .stat-label {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.7;
    }
    
    .logo {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 700;
      opacity: 0.6;
      letter-spacing: 2px;
    }
    
    /* Connection lines */
    .connections {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    
    .connection {
      position: absolute;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transform-origin: left center;
    }
    
    .connection:nth-child(1) {
      width: 200px;
      top: 30%;
      left: 5%;
      transform: rotate(25deg);
    }
    
    .connection:nth-child(2) {
      width: 150px;
      top: 70%;
      right: 10%;
      transform: rotate(-20deg);
    }
  </style>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/TOG-Logo-New.png">
</head>
<body>
  <div class="card">
    <div class="grid"></div>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="connections">
      <div class="connection"></div>
      <div class="connection"></div>
    </div>
    
    <div class="content">
      <div class="badge">Building in Public</div>
      
      <h1 class="title">
        Building an AI Business
        <br><span>in 21 Days</span>
      </h1>
      
      <p class="subtitle">The real story: from zero to $800 MRR, 5 clients, and an AI that made its first autonomous decision</p>
      
      <div class="stats">
        <div class="stat">
          <div class="stat-number">21</div>
          <div class="stat-label">Days</div>
        </div>
        <div class="stat">
          <div class="stat-number">$800</div>
          <div class="stat-label">Monthly Recurring</div>
        </div>
        <div class="stat">
          <div class="stat-number">5</div>
          <div class="stat-label">Clients</div>
        </div>
      </div>
    </div>
    
    <div class="logo">THE ONE GROUP</div>
  </div>
</body>
</html>
