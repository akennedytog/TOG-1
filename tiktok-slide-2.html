<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Slide 2 - Problem</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 1080px;
            height: 1920px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }
        .glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.25) 0%, transparent 70%);
            bottom: 20%;
            right: -10%;
            pointer-events: none;
        }
        .content {
            text-align: center;
            z-index: 1;
            padding: 60px;
            width: 100%;
        }
        .header {
            font-size: 48px;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-bottom: 100px;
        }
        .problems {
            display: flex;
            flex-direction: column;
            gap: 60px;
            margin-bottom: 100px;
        }
        .problem-item {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(139, 92, 246, 0.1) 100%);
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 30px;
            padding: 50px 60px;
            font-size: 64px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
        }
        .problem-item:nth-child(2) {
            border-color: rgba(139, 92, 246, 0.4);
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.15) 0%, rgba(168, 85, 247, 0.1) 100%);
        }
        .problem-item:nth-child(3) {
            border-color: rgba(168, 85, 247, 0.4);
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.15) 0%, rgba(139, 92, 246, 0.1) 100%);
        }
        .emoji {
            font-size: 60px;
            margin-bottom: 20px;
        }
        .arrow {
            font-size: 80px;
            color: #3b82f6;
            margin-top: 60px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(20px); }
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="content">
        <div class="header">Sound Familiar?</div>
        <div class="problems">
            <div class="problem-item">
                <div class="emoji">😰</div>
                Missing leads?
            </div>
            <div class="problem-item">
                <div class="emoji">⏰</div>
                No time for content?
            </div>
            <div class="problem-item">
                <div class="emoji">📊</div>
                Manual research killing you?
            </div>
        </div>
        <div class="arrow">👇</div>
    </div>
</body>
</html>
