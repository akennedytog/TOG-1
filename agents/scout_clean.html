<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scout | Sales Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(148, 163, 184, 0.1); }
        .card-hover { transition: all 0.3s; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .animate-fade { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-950 text-slate-100">
    <!-- Header -->
    <header class="glass sticky top-0 z-50 border-b border-slate-800">
        <div class="px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-green-500 to-cyan-500 flex items-center justify-center">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold">Scout</h1>
                    <p class="text-xs text-slate-500">Sales Intelligence</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <button id="uploadBtn" class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    Upload
                </button>
                <button id="downloadBtn" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Export
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="p-6 max-w-7xl mx-auto space-y-6">
        <!-- Status -->
        <div id="statusMsg" class="text-center py-4 text-slate-400">
            Loading data...
        </div>

        <!-- KPI Cards -->
        <div id="kpiSection" class="hidden grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="glass rounded-xl p-5 card-hover">
                <p class="text-sm text-slate-500">Total Reps</p>
                <p id="kpiReps" class="text-3xl font-bold mt-2">—</p>
            </div>
            <div class="glass rounded-xl p-5 card-hover">
                <p class="text-sm text-slate-500">Team POD</p>
                <p id="kpiPod" class="text-3xl font-bold mt-2">—</p>
                <div class="h-2 bg-slate-800 rounded-full mt-2"><div id="kpiProgress" class="h-full bg-green-500 rounded-full" style="width:0%"></div></div>
            </div>
            <div class="glass rounded-xl p-5 card-hover">
                <p class="text-sm text-slate-500">% to Goal</p>
                <p id="kpiPct" class="text-3xl font-bold mt-2 text-green-400">—</p>
            </div>
            <div class="glass rounded-xl p-5 card-hover">
                <p class="text-sm text-slate-500">Behind Goal</p>
                <p id="kpiBehind" class="text-3xl font-bold mt-2 text-red-400">—</p>
            </div>
        </div>

        <!-- Charts -->
        <div id="chartSection" class="hidden grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="glass rounded-xl p-6">
                <h3 class="font-semibold mb-4">Performance Trend</h3>
                <div class="h-48"><canvas id="trendChart"></canvas></div>
            </div>
            <div class="glass rounded-xl p-6">
                <h3 class="font-semibold mb-4">Team Status</h3>
                <div class="h-48"><canvas id="statusChart"></canvas></div>
            </div>
        </div>

        <!-- Top Performers -->
        <div id="tableSection" class="hidden glass rounded-xl overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-800">
                <h3 class="font-semibold">Top Performers</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-slate-800/50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs text-slate-500 uppercase">Rank</th>
                            <th class="px-6 py-3 text-left text-xs text-slate-500 uppercase">Rep</th>
                            <th class="px-6 py-3 text-left text-xs text-slate-500 uppercase">New POD</th>
                            <th class="px-6 py-3 text-left text-xs text-slate-500 uppercase">Goal</th>
                            <th class="px-6 py-3 text-left text-xs text-slate-500 uppercase">Status</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-800"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Upload Modal -->
    <div id="uploadModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center">
        <div class="glass rounded-2xl p-8 max-w-md w-full mx-4">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-semibold">Upload Report</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white">✕</button>
            </div>
            <div id="dropArea" class="border-2 border-dashed border-slate-600 rounded-xl p-8 text-center cursor-pointer hover:border-green-500 transition">
                <svg class="w-12 h-12 mx-auto mb-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                <p class="text-slate-300">Drop file here or click to browse</p>
                <input type="file" id="fileInput" accept=".xlsx,.csv" class="hidden" onchange="onFileSelect(event)">
            </div>
            <div id="filePreview" class="mt-4 hidden">
                <div class="flex items-center gap-3 p-3 bg-slate-800 rounded-lg">
                    <div class="flex-1">
                        <p id="previewName" class="text-sm font-medium"></p>
                    </div>
                    <button onclick="processUpload()" class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded-lg text-sm">Process</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let data = null;
        let selectedFile = null;

        // Load data on page load
        fetch('data/scout_history/scout_data_20260425.json')
            .then(r => r.json())
            .then(d => { data = d; showData(); })
            .catch(e => { document.getElementById('statusMsg').textContent = 'Click Upload to load data'; });

        function showData() {
            document.getElementById('statusMsg').classList.add('hidden');
            document.getElementById('kpiSection').classList.remove('hidden');
            document.getElementById('chartSection').classList.remove('hidden');
            document.getElementById('tableSection').classList.remove('hidden');

            // KPIs
            document.getElementById('kpiReps').textContent = data.summary.total_reps;
            document.getElementById('kpiPod').textContent = data.summary.total_new_pod.toFixed(0);
            document.getElementById('kpiPct').textContent = (data.summary.team_pct_goal * 100).toFixed(1) + '%';
            document.getElementById('kpiProgress').style.width = Math.min(data.summary.team_pct_goal * 100, 100) + '%';
            document.getElementById('kpiBehind').textContent = data.reps.filter(r => r.status === 'behind').length;

            // Table
            const rows = data.top_performers.slice(0, 10).map((r, i) => `
                <tr class="hover:bg-slate-800/50 transition">
                    <td class="px-6 py-4">#${i + 1}</td>
                    <td class="px-6 py-4 font-medium">${r.rep_name}</td>
                    <td class="px-6 py-4">${r.new_pod || 0}</td>
                    <td class="px-6 py-4 text-slate-400">${r.goal || '-'}</td>
                    <td class="px-6 py-4"><span class="px-2 py-1 rounded-full text-xs ${r.status === 'exceeding' ? 'bg-green-500/20 text-green-400' : r.status === 'ontrack' ? 'bg-blue-500/20 text-blue-400' : 'bg-red-500/20 text-red-400'}">${r.status}</span></td>
                </tr>
            `).join('');
            document.getElementById('tableBody').innerHTML = rows;

            // Charts
            new Chart(document.getElementById('trendChart'), {
                type: 'line',
                data: {
                    labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
                    datasets: [{
                        label: 'New POD',
                        data: [200, 220, 245, data.summary.total_new_pod],
                        borderColor: '#22c55e',
                        tension: 0.4
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });

            new Chart(document.getElementById('statusChart'), {
                type: 'doughnut',
                data: {
                    labels: ['On Track', 'Behind', 'Exceeding', 'Unknown'],
                    datasets: [{
                        data: [
                            data.reps.filter(r => r.status === 'ontrack').length,
                            data.reps.filter(r => r.status === 'behind').length,
                            data.reps.filter(r => r.status === 'exceeding').length,
                            data.reps.filter(r => r.status === 'unknown').length
                        ],
                        backgroundColor: ['#22c55e', '#ef4444', '#f59e0b', '#64748b']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, cutout: '70%' }
            });
        }

        // Upload functionality
        document.getElementById('uploadBtn').onclick = () => {
            document.getElementById('uploadModal').classList.remove('hidden');
            document.getElementById('uploadModal').classList.add('flex');
        };

        function closeModal() {
            document.getElementById('uploadModal').classList.add('hidden');
            document.getElementById('uploadModal').classList.remove('flex');
        }

        // Drag and drop
        const dropArea = document.getElementById('dropArea');
        dropArea.onclick = () => document.getElementById('fileInput').click();
        dropArea.ondragover = (e) => { e.preventDefault(); dropArea.classList.add('border-green-500', 'bg-green-500/10'); };
        dropArea.ondragleave = () => dropArea.classList.remove('border-green-500', 'bg-green-500/10');
        dropArea.ondrop = (e) => {
            e.preventDefault();
            dropArea.classList.remove('border-green-500', 'bg-green-500/10');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        };

        function onFileSelect(e) {
            if (e.target.files.length) handleFile(e.target.files[0]);
        }

        function handleFile(file) {
            if (!file.name.match(/\.(xlsx?|csv)$/i)) {
                alert('Please upload Excel or CSV file');
                return;
            }
            selectedFile = file;
            document.getElementById('previewName').textContent = file.name;
            document.getElementById('filePreview').classList.remove('hidden');
        }

        function processUpload() {
            const fileName = selectedFile.name;
            closeModal();
            selectedFile = null;
            document.getElementById('filePreview').classList.add('hidden');
            setTimeout(() => {
                alert('Processing: ' + fileName + '\n\nIn production, this would:\n1. Send to Python backend\n2. Parse Excel/CSV\n3. Update dashboard');
            }, 100);
        }

        // Export functionality
        document.getElementById('downloadBtn').onclick = () => {
            if (!data) {
                alert('No data to export. Please wait for data to load or upload a file.');
                return;
            }
            
            const csv = [
                ['Rep Name', 'Level', 'New POD', 'Goal', 'Status'].join(','),
                ...data.reps.map(r => [r.rep_name, r.level, r.new_pod || 0, r.goal || '-', r.status].join(','))
            ].join('\n');
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'scout_report_' + new Date().toISOString().split('T')[0] + '.csv';
            a.click();
            URL.revokeObjectURL(url);
        };

        // Close modal on outside click
        document.getElementById('uploadModal').onclick = (e) => {
            if (e.target === document.getElementById('uploadModal')) closeModal();
        };

        // ESC key closes modal
        document.onkeydown = (e) => {
            if (e.key === 'Escape') closeModal();
        };
    </script>
</body>
</html>
