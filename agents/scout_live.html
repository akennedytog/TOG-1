<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scout - Sales Intelligence Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            color: #fff;
            line-height: 1.6;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #2a2a3a;
            margin-bottom: 30px;
        }
        h1 { font-size: 28px; font-weight: 700; }
        h1 span { color: #00d4aa; }
        .last-update { color: #888; font-size: 14px; }
        
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            border-left: 4px solid #333;
        }
        .card.excellent { border-left-color: #00d4aa; }
        .card.ontrack { border-left-color: #4a90d9; }
        .card.risk { border-left-color: #f39c12; }
        .card.behind { border-left-color: #e74c3c; }
        
        .card h3 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 10px;
        }
        .card .value {
            font-size: 36px;
            font-weight: 700;
        }
        
        .section {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }
        .section h2 {
            font-size: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            text-align: left;
            padding: 12px;
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            border-bottom: 1px solid #333;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #252538;
        }
        tr:hover { background: #252538; }
        
        .status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-exceeding { background: rgba(0, 212, 170, 0.2); color: #00d4aa; }
        .status-ontrack { background: rgba(74, 144, 217, 0.2); color: #4a90d9; }
        .status-risk { background: rgba(243, 156, 18, 0.2); color: #f39c12; }
        .status-behind { background: rgba(231, 76, 60, 0.2); color: #e74c3c; }
        
        .upload-area {
            border: 2px dashed #333;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        .upload-area:hover {
            border-color: #00d4aa;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #00d4aa;
            color: #0f0f1a;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-right: 10px;
        }
        
        .btn-secondary {
            background: transparent;
            border: 1px solid #00d4aa;
            color: #00d4aa;
        }
        
        .progress-bar {
            background: #333;
            border-radius: 4px;
            height: 8px;
            overflow: hidden;
        }
        .progress-fill {
            background: #00d4aa;
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s;
        }
        
        .insights-list {
            list-style: none;
        }
        .insight-item {
            padding: 15px;
            background: #252538;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 15px;
        }
        
        @media (max-width: 768px) {
            .summary-cards { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 <span>Scout</span> Sales Intelligence</h1>
            <div class="last-update">Last updated: <span id="updateTime">Loading...</span></div>
        </header>
        
        <div id="content">
            <!-- Content loaded dynamically -->
        </div>
        
        <div class="section" id="uploadSection">
            <h2>📤 Upload Report</h2>
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <p>Click to upload Excel report</p>
                <p style="color: #666; font-size: 14px; margin-top: 10px;">
                    Supports: Rep performance, Account visits, Sales data
                </p>
                <input type="file" id="fileInput" accept=".xlsx,.xls" style="display: none;" onchange="handleFileUpload(event)">
            </div>
        </div>
    </div>
    
    <script>
        let currentData = null;
        
        async function loadData() {
            try {
                // Try BF performance data first
                const response = await fetch('data/scout_output/bf_performance_latest.json');
                if (response.ok) {
                    const data = await response.json();
                    currentData = { type: 'bf_performance', ...data };
                    renderBFPerformance(data);
                    return;
                }
                
                // Fallback to other data types
                const fallbackResponse = await fetch('data/scout_output/briefing_latest.json');
                if (fallbackResponse.ok) {
                    const data = await fallbackResponse.json();
                    currentData = data;
                    if (data.data_type === 'field_activity') {
                        renderFieldActivity(data);
                    } else {
                        renderGeneric(data);
                    }
                }
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('content').innerHTML = `
                    <div class="section">
                        <h2>⚠️ No Data Available</h2>
                        <p>Upload an Excel report or run Scout analysis to see results.</p>
                        <button class="btn" onclick="location.reload()">Refresh</button>
                    </div>
                `;
            }
        }
        
        function renderBFPerformance(data) {
            const summary = data.summary;
            const teamPct = (summary.team_pct_goal * 100).toFixed(1);
            
            document.getElementById('updateTime').textContent = new Date().toLocaleString();
            
            document.getElementById('content').innerHTML = `
                <div class="summary-cards">
                    <div class="card">
                        <h3>Total Reps</h3>
                        <div class="value">${summary.total_reps}</div>
                    </div>
                    <div class="card excellent">
                        <h3>New POD</h3>
                        <div class="value">${summary.total_new_pod.toFixed(0)}</div>
                        <div style="font-size: 13px; color: #888; margin-top: 5px;">
                            Goal: ${summary.total_goal.toFixed(0)}
                        </div>
                        <div class="progress-bar" style="margin-top: 10px;">
                            <div class="progress-fill" style="width: ${Math.min(teamPct, 100)}%;"></div>
                        </div>
                        <div style="font-size: 13px; color: #00d4aa; margin-top: 5px;">
                            ${teamPct}% to Goal
                        </div>
                    </div>
                    <div class="card ontrack">
                        <h3>Total Payouts</h3>
                        <div class="value">$${summary.total_payout.toLocaleString()}</div>
                    </div>
                    <div class="card ${summary.team_pct_goal >= 1 ? 'excellent' : summary.team_pct_goal >= 0.8 ? 'risk' : 'behind'}">
                        <h3>Team Status</h3>
                        <div class="value" style="font-size: 24px;">
                            ${summary.team_pct_goal >= 1 ? '🎉' : summary.team_pct_goal >= 0.8 ? '⚠️' : '🚨'}
                        </div>
                        <div style="font-size: 14px; color: #888;">
                            ${summary.team_pct_goal >= 1 ? 'Exceeding' : summary.team_pct_goal >= 0.8 ? 'At Risk' : 'Behind'}
                        </div>
                    </div>
                </div>
                
                <div class="section">
                    <h2>🏆 Top Performers</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>Rank</th>
                                <th>Rep Name</th>
                                <th>New POD</th>
                                <th>Goal</th>
                                <th>% to Goal</th>
                                <th>Payout</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.top_performers.slice(0, 10).map((r, i) => `
                                <tr>
                                    <td>${i + 1}</td>
                                    <td><strong>${r.rep_name}</strong></td>
                                    <td>${r.new_pod ? r.new_pod.toFixed(0) : 0}</td>
                                    <td>${r.goal ? r.goal.toFixed(0) : '-'}</td>
                                    <td>${r.pct_goal ? (r.pct_goal * 100).toFixed(0) + '%' : '-'}</td>
                                    <td>$${r.total_payout ? r.total_payout.toFixed(0) : 0}</td>
                                    <td><span class="status status-${r.status}">${r.status}</span></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
                
                <div class="section">
                    <h2>⚠️ Needs Attention</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>Rep</th>
                                <th>New POD</th>
                                <th>Goal</th>
                                <th>% to Goal</th>
                                <th>Alert</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.needs_help.slice(0, 10).map(r => `
                                <tr>
                                    <td><strong>${r.rep_name}</strong></td>
                                    <td>${r.new_pod ? r.new_pod.toFixed(0) : 0}</td>
                                    <td>${r.goal ? r.goal.toFixed(0) : '-'}</td>
                                    <td>${r.pct_goal ? (r.pct_goal * 100).toFixed(0) + '%' : '-'}</td>
                                    <td>${r.alert}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
                
                <div class="section">
                    <h2>💡 Insights</h2>
                    <ul class="insights-list">
                        ${data.insights.map(i => `<li class="insight-item">${i}</li>`).join('')}
                    </ul>
                </div>
            `;
        }
        
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            // For now, just show a message that file is uploaded
            // In real implementation, this would trigger Scout analysis
            alert(`File "${file.name}" selected. In production, this would trigger Scout analysis.`);
        }
        
        // Load on page load
        loadData();
        
        // Refresh every 5 minutes
        setInterval(loadData, 300000);
    </script>
