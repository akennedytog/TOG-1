<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scout Pro | Sales Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(148, 163, 184, 0.1); }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <!-- Header -->
    <header class="glass sticky top-0 z-40 border-b border-slate-800">
        <div class="px-6 py-4 flex items-center justify-between max-w-7xl mx-auto">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-green-500 to-cyan-500 flex items-center justify-center">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold">Scout Pro</h1>
                    <p class="text-xs text-slate-500">Sales Intelligence Dashboard</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <input type="text" id="searchInput" placeholder="Search reps..." class="bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm w-48">
                <button id="uploadBtn" class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded-lg text-sm font-medium">Upload</button>
                <button id="exportBtn" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg text-sm font-medium">Export</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="p-6 max-w-7xl mx-auto space-y-6">
        <!-- Filters -->
        <div class="flex flex-wrap items-center gap-3">
            <span class="text-sm text-slate-500">Filter:</span>
            <select id="levelFilter" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm">
                <option value="all">All Levels</option>
                <option value="FSM">FSM</option>
                <option value="Rep">Rep</option>
            </select>
            <select id="statusFilter" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm">
                <option value="all">All Status</option>
                <option value="exceeding">Exceeding</option>
                <option value="ontrack">On Track</option>
                <option value="behind">Behind</option>
            </select>
            <span id="resultCount" class="text-sm text-slate-500 ml-auto"></span>
        </div>

        <!-- KPI Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="glass rounded-xl p-5 card-hover">
                <p class="text-sm text-slate-500">Total Reps</p>
                <p id="kpiReps" class="text-3xl font-bold mt-2">144</p>
            </div>
            <div class="glass rounded-xl p-5 card-hover">
                <p class="text-sm text-slate-500">Team New POD</p>
                <p id="kpiPod" class="text-3xl font-bold mt-2">264</p>
                <div class="h-2 bg-slate-800 rounded-full mt-2"><div class="h-full bg-gradient-to-r from-green-500 to-cyan-500 rounded-full" style="width:72%"></div></div>
            </div>
            <div class="glass rounded-xl p-5 card-hover">
                <p class="text-sm text-slate-500">% to Goal</p>
                <p id="kpiPct" class="text-3xl font-bold mt-2 text-green-400">72%</p>
            </div>
            <div class="glass rounded-xl p-5 card-hover">
                <p class="text-sm text-slate-500">Behind Goal</p>
                <p id="kpiBehind" class="text-3xl font-bold mt-2 text-red-400">21</p>
            </div>
        </div>

        <!-- Charts -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="glass rounded-xl p-6 card-hover">
                <h3 class="font-semibold mb-4">Performance Trend</h3>
                <div class="h-64"><canvas id="trendChart"></canvas></div>
            </div>
            <div class="glass rounded-xl p-6 card-hover">
                <h3 class="font-semibold mb-4">Status Distribution</h3>
                <div class="h-64 flex items-center justify-center"><canvas id="statusChart"></canvas></div>
            </div>
        </div>

        <!-- Top Performers -->
        <div class="glass rounded-xl overflow-hidden card-hover">
            <div class="px-6 py-4 border-b border-slate-800">
                <h3 class="font-semibold">Top Performers</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-slate-800/50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs text-slate-500 uppercase">Rank</th>
                            <th class="px-6 py-3 text-left text-xs text-slate-500 uppercase">Rep</th>
                            <th class="px-6 py-3 text-left text-xs text-slate-500 uppercase">Level</th>
                            <th class="px-6 py-3 text-left text-xs text-slate-500 uppercase">New POD</th>
                            <th class="px-6 py-3 text-left text-xs text-slate-500 uppercase">Goal</th>
                            <th class="px-6 py-3 text-left text-xs text-slate-500 uppercase">% to Goal</th>
                            <th class="px-6 py-3 text-left text-xs text-slate-500 uppercase">Status</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-800"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Upload Modal -->
    <div id="uploadModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="glass rounded-2xl p-8 max-w-md w-full mx-4">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-semibold">Upload Sales Report</h3>
                <button id="closeUpload" class="text-slate-400 hover:text-white text-2xl">&times;</button>
            </div>
            <div id="dropZone" class="border-2 border-dashed border-slate-600 rounded-xl p-8 text-center cursor-pointer hover:border-green-500">
                <p class="text-slate-300">Drop file here or click to browse</p>
                <input type="file" id="fileInput" accept=".xlsx,.csv" class="hidden">
            </div>
            <div id="uploadPreview" class="mt-4 hidden">
                <p id="fileName" class="text-sm"></p>
                <button id="processBtn" class="mt-2 bg-green-600 text-white px-4 py-2 rounded-lg w-full">Process</button>
            </div>
        </div>
    </div>

    <script>
        // EMBEDDED DATA - Works immediately without fetching
        const currentData = {
            summary: { total_reps: 144, total_new_pod: 264, total_goal: 366, team_pct_goal: 0.72, total_payout: 125430 },
            reps: [
                { rep_name: "APARICIO VANESSA", level: "FSM", new_pod: 12, goal: 21, pct_goal: 0.57, status: "behind" },
                { rep_name: "GAVIN LAWRENCE", level: "FSM", new_pod: 10, goal: 15, pct_goal: 0.67, status: "behind" },
                { rep_name: "VON UNGERN THEO", level: "FSM", new_pod: 10, goal: 15, pct_goal: 0.67, status: "behind" },
                { rep_name: "FETTERMAN GILLIAN", level: "FSM", new_pod: 10, goal: 18, pct_goal: 0.56, status: "behind" },
                { rep_name: "BRAY JAMES", level: "Rep", new_pod: 9, goal: 0, pct_goal: 0, status: "unknown" },
                { rep_name: "CARTWRIGHT MEGAN", level: "FSM", new_pod: 8, goal: 22, pct_goal: 0.36, status: "behind" },
                { rep_name: "GAGNELIUS WESLEY", level: "FSM", new_pod: 8, goal: 18, pct_goal: 0.44, status: "behind" },
                { rep_name: "TAPPAN CHARLES", level: "FSM", new_pod: 8, goal: 16, pct_goal: 0.50, status: "behind" },
                { rep_name: "HARTMANN CHRISTIAN", level: "FSM", new_pod: 7, goal: 15, pct_goal: 0.47, status: "behind" },
                { rep_name: "DRUASH KENDALL", level: "FSM", new_pod: 7, goal: 15, pct_goal: 0.47, status: "behind" }
            ]
        };
        
        let filteredData = [...currentData.reps];

        // Render table
        function renderTable(data) {
            const sorted = [...data].sort((a, b) => (b.pct_goal || 0) - (a.pct_goal || 0));
            document.getElementById('tableBody').innerHTML = sorted.map((r, i) => {
                const pct = r.pct_goal ? (r.pct_goal * 100).toFixed(0) + '%' : '-';
                const statusColor = r.status === 'behind' ? 'bg-red-500/20 text-red-400' : 'bg-slate-500/20 text-slate-400';
                return `
                    <tr class="hover:bg-slate-800/50">
                        <td class="px-6 py-4">#${i + 1}</td>
                        <td class="px-6 py-4 font-medium">${r.rep_name}</td>
                        <td class="px-6 py-4 text-slate-400">${r.level}</td>
                        <td class="px-6 py-4">${r.new_pod || 0}</td>
                        <td class="px-6 py-4 text-slate-400">${r.goal || '-'}</td>
                        <td class="px-6 py-4">${pct}</td>
                        <td class="px-6 py-4"><span class="px-2 py-1 rounded-full text-xs ${statusColor}">${r.status}</span></td>
                    </tr>
                `;
            }).join('');
        }

        // Render charts
        function renderCharts() {
            new Chart(document.getElementById('trendChart'), {
                type: 'line',
                data: {
                    labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
                    datasets: [{
                        label: 'New POD',
                        data: [180, 210, 240, 264],
                        borderColor: '#22c55e',
                        backgroundColor: 'rgba(34, 197, 94, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            new Chart(document.getElementById('statusChart'), {
                type: 'doughnut',
                data: {
                    labels: ['Behind', 'On Track', 'Exceeding'],
                    datasets: [{
                        data: [21, 89, 34],
                        backgroundColor: ['#ef4444', '#3b82f6', '#22c55e']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, cutout: '70%' }
            });
        }

        // Filters
        function applyFilters() {
            const level = document.getElementById('levelFilter').value;
            const status = document.getElementById('statusFilter').value;
            const search = document.getElementById('searchInput').value.toLowerCase();
            
            filteredData = currentData.reps.filter(r => {
                if (level !== 'all' && r.level !== level) return false;
                if (status !== 'all' && r.status !== status) return false;
                if (search && !r.rep_name.toLowerCase().includes(search)) return false;
                return true;
            });
            
            renderTable(filteredData);
            document.getElementById('resultCount').textContent = filteredData.length + ' results';
        }

        document.getElementById('levelFilter').addEventListener('change', applyFilters);
        document.getElementById('statusFilter').addEventListener('change', applyFilters);
        document.getElementById('searchInput').addEventListener('input', applyFilters);

        // Upload
        document.getElementById('uploadBtn').addEventListener('click', () => {
            document.getElementById('uploadModal').classList.remove('hidden');
            document.getElementById('uploadModal').classList.add('flex');
        });

        document.getElementById('closeUpload').addEventListener('click', () => {
            document.getElementById('uploadModal').classList.add('hidden');
            document.getElementById('uploadModal').classList.remove('flex');
        });

        const dropZone = document.getElementById('dropZone');
        dropZone.addEventListener('click', () => document.getElementById('fileInput').click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-green-500'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-green-500'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-green-500');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });

        document.getElementById('fileInput').addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('uploadPreview').classList.remove('hidden');
        }

        document.getElementById('processBtn').addEventListener('click', () => {
            document.getElementById('uploadModal').classList.add('hidden');
            document.getElementById('uploadModal').classList.remove('flex');
            alert('✅ File processed! In production, this would update the dashboard with new data.');
        });

        // Export
        document.getElementById('exportBtn').addEventListener('click', () => {
            const csv = [
                ['Rank', 'Rep', 'Level', 'New POD', 'Goal', '% to Goal'].join(','),
                ...filteredData.map((r, i) => [i + 1, r.rep_name, r.level, r.new_pod, r.goal, (r.pct_goal * 100).toFixed(0) + '%'].join(','))
            ].join('\n');
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'scout_report.csv';
            a.click();
            URL.revokeObjectURL(url);
        });

        // Initialize
        renderTable(filteredData);
        renderCharts();
        document.getElementById('resultCount').textContent = filteredData.length + ' results';
    </script>
</body>
</html>
