<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scout | Sales Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(148, 163, 184, 0.1); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100">
    <header class="glass sticky top-0 z-50 border-b border-slate-800 px-6 py-4">
        <div class="flex items-center justify-between max-w-7xl mx-auto">
            <h1 class="text-xl font-bold">🎯 Scout</h1>
            <div class="flex gap-3">
                <button id="uploadBtn" class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded-lg">Upload</button>
                <button id="exportBtn" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg">Export</button>
            </div>
        </div>
    </header>

    <main class="p-6 max-w-7xl mx-auto">
        <p id="status">Click Upload to add a file</p>
    </main>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="glass rounded-2xl p-6 w-full max-w-md mx-4">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold">Upload File</h3>
                <button id="closeModal" class="text-slate-400 hover:text-white text-xl">&times;</button>
            </div>
            <div id="dropZone" class="border-2 border-dashed border-slate-600 rounded-xl p-8 text-center cursor-pointer hover:border-green-500">
                <p class="text-slate-300">Click here to select file</p>
                <input type="file" id="fileInput" class="hidden" accept=".xlsx,.csv">
            </div>
            <div id="preview" class="mt-4 hidden">
                <p id="fileName" class="text-sm text-slate-300"></p>
                <button id="processBtn" class="mt-2 bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded-lg w-full">Process File</button>
            </div>
        </div>
    </div>

    <script>
        console.log('Script loaded');
        
        const uploadBtn = document.getElementById('uploadBtn');
        const modal = document.getElementById('modal');
        const closeModal = document.getElementById('closeModal');
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const fileName = document.getElementById('fileName');
        const processBtn = document.getElementById('processBtn');
        const exportBtn = document.getElementById('exportBtn');
        
        let selectedFile = null;

        // Upload button opens modal
        uploadBtn.addEventListener('click', function() {
            console.log('Upload clicked');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        });

        // Close modal
        closeModal.addEventListener('click', function() {
            console.log('Close clicked');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        });

        // Click drop zone to open file picker
        dropZone.addEventListener('click', function() {
            console.log('Drop zone clicked');
            fileInput.click();
        });

        // File selected
        fileInput.addEventListener('change', function(e) {
            console.log('File selected:', e.target.files);
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                fileName.textContent = selectedFile.name;
                preview.classList.remove('hidden');
            }
        });

        // Process button
        processBtn.addEventListener('click', function() {
            console.log('Process clicked');
            if (selectedFile) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                document.getElementById('status').textContent = 'Processing: ' + selectedFile.name;
                
                setTimeout(function() {
                    alert('File "' + selectedFile.name + '" ready for processing!\n\nIn production, this would:\n1. Send to Python backend\n2. Parse Excel/CSV\n3. Update dashboard');
                    selectedFile = null;
                    preview.classList.add('hidden');
                    document.getElementById('status').textContent = 'File processed successfully!';
                }, 100);
            }
        });

        // Export button
        exportBtn.addEventListener('click', function() {
            console.log('Export clicked');
            alert('Export feature would download CSV here');
        });

        // Close modal on outside click
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        });

        console.log('All event listeners attached');
    </script>
</body>
</html>
