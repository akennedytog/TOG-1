<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scout Pro | Sales Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(148, 163, 184, 0.1); }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .animate-in { animation: fadeInUp 0.5s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <!-- Header -->
    <header class="glass sticky top-0 z-40 border-b border-slate-800">
        <div class="px-6 py-4 flex items-center justify-between max-w-7xl mx-auto">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-green-500 to-cyan-500 flex items-center justify-center">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold">Scout Pro</h1>
                    <p class="text-xs text-slate-500">Sales Intelligence Dashboard</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <input type="text" id="searchInput" placeholder="Search reps..." class="bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm w-48 focus:outline-none focus:border-green-500">
                <button id="uploadBtn" class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                    Upload
                </button>
                <button id="exportBtn" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    Export
                </button>
                <button id="settingsBtn" class="p-2 hover:bg-slate-800 rounded-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="p-6 max-w-7xl mx-auto space-y-6">
        <!-- Filters -->
        <div class="flex flex-wrap items-center gap-3">
            <span class="text-sm text-slate-500">Filter:</span>
            <select id="levelFilter" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm">
                <option value="all">All Levels</option>
                <option value="FSM">FSM</option>
                <option value="Rep">Rep</option>
            </select>
            <select id="statusFilter" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm">
                <option value="all">All Status</option>
                <option value="exceeding">Exceeding</option>
                <option value="ontrack">On Track</option>
                <option value="behind">Behind</option>
            </select>
            <span id="resultCount" class="text-sm text-slate-500 ml-auto"></span>
        </div>

        <!-- KPI Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4" id="kpiSection">
            <div class="glass rounded-xl p-5 card-hover animate-in">
                <p class="text-sm text-slate-500">Total Reps</p>
                <p id="kpiReps" class="text-3xl font-bold mt-2">—</p>
            </div>
            <div class="glass rounded-xl p-5 card-hover animate-in" style="animation-delay: 0.1s">
                <p class="text-sm text-slate-500">Team New POD</p>
                <p id="kpiPod" class="text-3xl font-bold mt-2">—</p>
                <div class="h-2 bg-slate-800 rounded-full mt-2"><div id="kpiProgress" class="h-full bg-gradient-to-r from-green-500 to-cyan-500 rounded-full transition-all" style="width:0%"></div></div>
            </div>
            <div class="glass rounded-xl p-5 card-hover animate-in" style="animation-delay: 0.2s">
                <p class="text-sm text-slate-500">% to Goal</p>
                <p id="kpiPct" class="text-3xl font-bold mt-2 text-green-400">—</p>
            </div>
            <div class="glass rounded-xl p-5 card-hover animate-in" style="animation-delay: 0.3s">
                <p class="text-sm text-slate-500">Behind Goal</p>
                <p id="kpiBehind" class="text-3xl font-bold mt-2 text-red-400">—</p>
            </div>
        </div>

        <!-- Charts -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="glass rounded-xl p-6 card-hover">
                <h3 class="font-semibold mb-4">Performance Trend</h3>
                <div class="h-64"><canvas id="trendChart"></canvas></div>
            </div>
            <div class="glass rounded-xl p-6 card-hover">
                <h3 class="font-semibold mb-4">Status Distribution</h3>
                <div class="h-64 flex items-center justify-center"><canvas id="statusChart"></canvas></div>
            </div>
        </div>

        <!-- Top Performers Table -->
        <div class="glass rounded-xl overflow-hidden card-hover">
            <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between">
                <h3 class="font-semibold">Top Performers</h3>
                <button id="viewAllBtn" class="text-sm text-green-400 hover:text-green-300">View All</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-slate-800/50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs text-slate-500 uppercase">Rank</th>
                            <th class="px-6 py-3 text-left text-xs text-slate-500 uppercase">Rep</th>
                            <th class="px-6 py-3 text-left text-xs text-slate-500 uppercase">Level</th>
                            <th class="px-6 py-3 text-left text-xs text-slate-500 uppercase">New POD</th>
                            <th class="px-6 py-3 text-left text-xs text-slate-500 uppercase">Goal</th>
                            <th class="px-6 py-3 text-left text-xs text-slate-500 uppercase">% to Goal</th>
                            <th class="px-6 py-3 text-left text-xs text-slate-500 uppercase">Status</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-800"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Upload Modal -->
    <div id="uploadModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center">
        <div class="glass rounded-2xl p-8 max-w-md w-full mx-4">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-semibold">Upload Sales Report</h3>
                <button id="closeUpload" class="text-slate-400 hover:text-white text-2xl">&times;</button>
            </div>
            <div id="dropZone" class="border-2 border-dashed border-slate-600 rounded-xl p-8 text-center cursor-pointer hover:border-green-500 hover:bg-green-500/5 transition">
                <svg class="w-12 h-12 mx-auto mb-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                <p class="text-slate-300 mb-2">Drop Excel or CSV file here</p>
                <p class="text-sm text-slate-500">or click to browse</p>
                <input type="file" id="fileInput" accept=".xlsx,.csv" class="hidden">
            </div>
            <div id="uploadPreview" class="mt-4 hidden">
                <div class="flex items-center gap-3 p-3 bg-slate-800 rounded-lg">
                    <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    <div class="flex-1">
                        <p id="fileName" class="text-sm font-medium"></p>
                        <p id="fileSize" class="text-xs text-slate-500"></p>
                    </div>
                    <button id="processBtn" class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded-lg text-sm font-medium">Process</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center">
        <div class="glass rounded-2xl p-6 max-w-md w-full mx-4">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-semibold">Settings</h3>
                <button id="closeSettings" class="text-slate-400 hover:text-white text-2xl">&times;</button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2">Dashboard Theme</label>
                    <div class="flex gap-2">
                        <button class="flex-1 p-3 rounded-lg bg-slate-800 border border-green-500 text-center"><span class="text-2xl">🌙</span><p class="text-xs mt-1">Dark</p></button>
                        <button class="flex-1 p-3 rounded-lg bg-slate-100 text-slate-900 text-center"><span class="text-2xl">☀️</span><p class="text-xs mt-1">Light</p></button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Notifications</label>
                    <label class="flex items-center gap-3 p-3 bg-slate-800 rounded-lg cursor-pointer"><input type="checkbox" checked class="w-4 h-4 accent-green-500"><span class="text-sm">Daily summary emails</span></label>
                    <label class="flex items-center gap-3 p-3 bg-slate-800 rounded-lg cursor-pointer mt-2"><input type="checkbox" checked class="w-4 h-4 accent-green-500"><span class="text-sm">Behind goal alerts</span></label>
                </div>
                <button id="saveSettings" class="w-full bg-green-600 hover:bg-green-500 text-white py-2 rounded-lg font-medium">Save Settings</button>
            </div>
        </div>
    </div>

    <script>
        // Data
        let currentData = null;
        let filteredData = null;
        let uploadedFile = null;

        // Load data
        fetch('../data/scout_history/scout_data_20260425.json')
            .then(r => r.json())
            .then(d => { currentData = d; filteredData = d.reps; renderDashboard(); })
            .catch(e => { 
                console.log('No initial data:', e);
                // Show message to user
                const main = document.querySelector('main');
                const msg = document.createElement('div');
                msg.className = 'glass rounded-xl p-4 text-center text-amber-400 mb-6';
                msg.innerHTML = '⚠️ No data loaded. Click "Upload" to add your first sales report.';
                main.insertBefore(msg, main.firstChild);
            });

        // Render dashboard
        function renderDashboard() {
            if (!currentData) return;
            
            const { summary, reps, top_performers, needs_help } = currentData;
            
            // KPIs
            document.getElementById('kpiReps').textContent = summary.total_reps;
            document.getElementById('kpiPod').textContent = summary.total_new_pod.toFixed(0);
            document.getElementById('kpiPct').textContent = (summary.team_pct_goal * 100).toFixed(1) + '%';
            document.getElementById('kpiProgress').style.width = Math.min(summary.team_pct_goal * 100, 100) + '%';
            document.getElementById('kpiBehind').textContent = reps.filter(r => r.status === 'behind').length;
            
            // Table
            renderTable(filteredData.slice(0, 10));
            
            // Charts
            renderCharts(reps);
            
            // Result count
            document.getElementById('resultCount').textContent = filteredData.length + ' reps';
        }

        function renderTable(data) {
            const sorted = [...data].sort((a, b) => (b.pct_goal || 0) - (a.pct_goal || 0));
            document.getElementById('tableBody').innerHTML = sorted.map((r, i) => {
                const pct = r.pct_goal ? (r.pct_goal * 100).toFixed(0) + '%' : '-';
                const statusColor = r.status === 'exceeding' ? 'bg-green-500/20 text-green-400' : 
                                   r.status === 'ontrack' ? 'bg-blue-500/20 text-blue-400' : 
                                   r.status === 'behind' ? 'bg-red-500/20 text-red-400' : 'bg-slate-500/20 text-slate-400';
                return `
                    <tr class="hover:bg-slate-800/50 transition">
                        <td class="px-6 py-4">#${i + 1}</td>
                        <td class="px-6 py-4 font-medium">${r.rep_name}</td>
                        <td class="px-6 py-4 text-slate-400">${r.level}</td>
                        <td class="px-6 py-4">${r.new_pod || 0}</td>
                        <td class="px-6 py-4 text-slate-400">${r.goal || '-'}</td>
                        <td class="px-6 py-4">${pct}</td>
                        <td class="px-6 py-4"><span class="px-2 py-1 rounded-full text-xs ${statusColor}">${r.status}</span></td>
                    </tr>
                `;
            }).join('');
        }

        function renderCharts(reps) {
            // Destroy existing charts
            Chart.getChart('trendChart')?.destroy();
            Chart.getChart('statusChart')?.destroy();
            
            // Trend chart
            new Chart(document.getElementById('trendChart'), {
                type: 'line',
                data: {
                    labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
                    datasets: [{
                        label: 'New POD',
                        data: [180, 210, 235, currentData.summary.total_new_pod],
                        borderColor: '#22c55e',
                        backgroundColor: 'rgba(34, 197, 94, 0.1)',
                        fill: true,
                        tension: 0.4
                    }, {
                        label: 'Goal',
                        data: [200, 220, 240, currentData.summary.total_goal],
                        borderColor: '#22d3ee',
                        borderDash: [5, 5],
                        fill: false,
                        tension: 0.4
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#94a3b8' } } },
                    scales: {
                        y: { grid: { color: 'rgba(148, 163, 184, 0.1)' }, ticks: { color: '#94a3b8' } },
                        x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                    }
                }
            });
            
            // Status chart
            const statusCounts = {
                'Exceeding': reps.filter(r => r.status === 'exceeding').length,
                'On Track': reps.filter(r => r.status === 'ontrack').length,
                'Behind': reps.filter(r => r.status === 'behind').length,
                'Unknown': reps.filter(r => r.status === 'unknown').length
            };
            
            new Chart(document.getElementById('statusChart'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(statusCounts),
                    datasets: [{
                        data: Object.values(statusCounts),
                        backgroundColor: ['#22c55e', '#3b82f6', '#ef4444', '#64748b'],
                        borderWidth: 0
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8', padding: 20 } } },
                    cutout: '70%'
                }
            });
        }

        // Filter functionality
        function applyFilters() {
            if (!currentData) return;
            const level = document.getElementById('levelFilter').value;
            const status = document.getElementById('statusFilter').value;
            const search = document.getElementById('searchInput').value.toLowerCase();
            
            filteredData = currentData.reps.filter(r => {
                if (level !== 'all' && r.level !== level) return false;
                if (status !== 'all' && r.status !== status) return false;
                if (search && !r.rep_name.toLowerCase().includes(search)) return false;
                return true;
            });
            
            renderTable(filteredData.slice(0, 10));
            document.getElementById('resultCount').textContent = filteredData.length + ' results';
        }

        document.getElementById('levelFilter').addEventListener('change', applyFilters);
        document.getElementById('statusFilter').addEventListener('change', applyFilters);
        document.getElementById('searchInput').addEventListener('input', applyFilters);

        // Upload functionality
        document.getElementById('uploadBtn').addEventListener('click', () => {
            document.getElementById('uploadModal').classList.remove('hidden');
            document.getElementById('uploadModal').classList.add('flex');
        });

        document.getElementById('closeUpload').addEventListener('click', () => {
            document.getElementById('uploadModal').classList.add('hidden');
            document.getElementById('uploadModal').classList.remove('flex');
        });

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');

        dropZone.addEventListener('click', () => fileInput.click());
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-green-500', 'bg-green-500/10');
        });
        
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('border-green-500', 'bg-green-500/10');
        });
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-green-500', 'bg-green-500/10');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            if (!file.name.match(/\.(xlsx?|csv)$/i)) {
                alert('Please upload Excel or CSV file');
                return;
            }
            uploadedFile = file;
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = (file.size / 1024).toFixed(1) + ' KB';
            document.getElementById('uploadPreview').classList.remove('hidden');
        }

        document.getElementById('processBtn').addEventListener('click', () => {
            if (!uploadedFile) return;
            const fileName = uploadedFile.name;
            
            // Close modal
            document.getElementById('uploadModal').classList.add('hidden');
            document.getElementById('uploadModal').classList.remove('flex');
            document.getElementById('uploadPreview').classList.add('hidden');
            
            // Show success
            setTimeout(() => {
                alert('✅ File "' + fileName + '" processed successfully!\n\nIn production, this would:\n1. Send to Python backend (scout.py)\n2. Parse Excel/CSV data\n3. Run analysis\n4. Update dashboard with new data');
                uploadedFile = null;
            }, 100);
        });

        // Export functionality
        document.getElementById('exportBtn').addEventListener('click', () => {
            if (!currentData) {
                alert('No data to export. Load data first.');
                return;
            }
            
            const csv = [
                ['Rank', 'Rep Name', 'Level', 'New POD', 'Goal', '% to Goal', 'Status'].join(','),
                ...filteredData.map((r, i) => [
                    i + 1, r.rep_name, r.level, r.new_pod || 0, r.goal || '-', 
                    r.pct_goal ? (r.pct_goal * 100).toFixed(0) + '%' : '-', r.status
                ].join(','))
            ].join('\n');
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'scout_report_' + new Date().toISOString().split('T')[0] + '.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // Settings functionality
        document.getElementById('settingsBtn').addEventListener('click', () => {
            document.getElementById('settingsModal').classList.remove('hidden');
            document.getElementById('settingsModal').classList.add('flex');
        });

        document.getElementById('closeSettings').addEventListener('click', () => {
            document.getElementById('settingsModal').classList.add('hidden');
            document.getElementById('settingsModal').classList.remove('flex');
        });

        document.getElementById('saveSettings').addEventListener('click', () => {
            document.getElementById('settingsModal').classList.add('hidden');
            document.getElementById('settingsModal').classList.remove('flex');
            alert('Settings saved!');
        });

        // Close modals on outside click
        document.getElementById('uploadModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('uploadModal')) {
                document.getElementById('uploadModal').classList.add('hidden');
                document.getElementById('uploadModal').classList.remove('flex');
            }
        });

        document.getElementById('settingsModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('settingsModal')) {
                document.getElementById('settingsModal').classList.add('hidden');
                document.getElementById('settingsModal').classList.remove('flex');
            }
        });

        // ESC key closes modals
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.getElementById('uploadModal').classList.add('hidden');
                document.getElementById('uploadModal').classList.remove('flex');
                document.getElementById('settingsModal').classList.add('hidden');
                document.getElementById('settingsModal').classList.remove('flex');
            }
        });
    </script>
</body>
</html>
