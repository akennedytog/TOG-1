<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scout | Sales Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(148, 163, 184, 0.1); }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <!-- Sidebar -->
    <aside class="fixed left-0 top-0 h-full w-64 glass border-r border-slate-800 z-50 hidden md:block">
        <div class="p-6">
            <div class="flex items-center gap-3 mb-8">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-green-500 to-cyan-500 flex items-center justify-center">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold">Scout</h1>
                    <p class="text-xs text-slate-500">Sales Intelligence</p>
                </div>
            </div>
            
            <nav class="space-y-1">
                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-slate-800 text-green-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                    <span class="font-medium">Dashboard</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    <span>Reps</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0121 18.382V7.618a1 1 0 00-.553-.894L15 7m0 13V7"/></svg>
                    <span>Territories</span>
                </a>
            </nav>
            
            <div class="mt-8 pt-6 border-t border-slate-800">
                <p class="text-xs text-slate-500 uppercase tracking-wider mb-4">Quick Actions</p>
                <button onclick="alert('Upload feature requires Python backend (scout.py) to process Excel files.\\n\\nFor demo purposes, the dashboard shows sample data.')" class="w-full flex items-center gap-3 px-4 py-2 rounded-lg bg-green-600 hover:bg-green-500 text-white transition text-sm font-medium">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                    Upload Report
                </button>
            </div>
        </div>
        
        <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-slate-800">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center text-sm font-bold">A</div>
                <div class="flex-1">
                    <p class="text-sm font-medium">Alec Kennedy</p>
                    <p class="text-xs text-slate-500">Manager</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="md:ml-64 min-h-screen">
        <header class="glass sticky top-0 z-40 border-b border-slate-800">
            <div class="px-6 py-4 flex items-center justify-between">
                <div>
                    <h2 class="text-xl font-semibold">Dashboard</h2>
                    <p class="text-sm text-slate-500">Updated just now</p>
                </div>
                <button onclick="exportCSV()" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    Export
                </button>
            </div>
        </header>

        <div class="p-6 space-y-6">
            <!-- KPI Cards -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="glass rounded-xl p-5 card-hover">
                    <p class="text-sm text-slate-500">Total Reps</p>
                    <p class="text-3xl font-bold mt-2">144</p>
                </div>
                <div class="glass rounded-xl p-5 card-hover">
                    <p class="text-sm text-slate-500">Team New POD</p>
                    <p class="text-3xl font-bold mt-2">264</p>
                    <div class="h-2 bg-slate-800 rounded-full mt-2"><div class="h-full bg-gradient-to-r from-green-500 to-cyan-500 rounded-full" style="width:72%"></div></div>
                </div>
                <div class="glass rounded-xl p-5 card-hover">
                    <p class="text-sm text-slate-500">% to Goal</p>
                    <p class="text-3xl font-bold mt-2 text-green-400">72%</p>
                </div>
                <div class="glass rounded-xl p-5 card-hover">
                    <p class="text-sm text-slate-500">Behind Goal</p>
                    <p class="text-3xl font-bold mt-2 text-red-400">21</p>
                </div>
            </div>

            <!-- Charts -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="glass rounded-xl p-6 card-hover">
                    <h3 class="font-semibold mb-4">Performance Trend</h3>
                    <div class="h-64"><canvas id="trendChart"></canvas></div>
                </div>
                <div class="glass rounded-xl p-6 card-hover">
                    <h3 class="font-semibold mb-4">Status Distribution</h3>
                    <div class="h-64 flex items-center justify-center"><canvas id="statusChart"></canvas></div>
                </div>
            </div>

            <!-- Top Performers -->
            <div class="glass rounded-xl overflow-hidden card-hover">
                <div class="px-6 py-4 border-b border-slate-800">
                    <h3 class="font-semibold">Top Performers</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-slate-800/50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs text-slate-500 uppercase">Rank</th>
                                <th class="px-6 py-3 text-left text-xs text-slate-500 uppercase">Rep</th>
                                <th class="px-6 py-3 text-left text-xs text-slate-500 uppercase">Level</th>
                                <th class="px-6 py-3 text-left text-xs text-slate-500 uppercase">New POD</th>
                                <th class="px-6 py-3 text-left text-xs text-slate-500 uppercase">Goal</th>
                                <th class="px-6 py-3 text-left text-xs text-slate-500 uppercase">% to Goal</th>
                                <th class="px-6 py-3 text-left text-xs text-slate-500 uppercase">Status</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-slate-800"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Working embedded data
        const reps = [
            { name: "APARICIO VANESSA", level: "FSM", new_pod: 12, goal: 21, pct: 57, status: "behind" },
            { name: "GAVIN LAWRENCE", level: "FSM", new_pod: 10, goal: 15, pct: 67, status: "behind" },
            { name: "VON UNGERN STERNBERG THEO", level: "FSM", new_pod: 10, goal: 15, pct: 67, status: "behind" },
            { name: "FETTERMAN GILLIAN", level: "FSM", new_pod: 10, goal: 18, pct: 56, status: "behind" },
            { name: "BRAY JAMES", level: "Rep", new_pod: 9, goal: 0, pct: 0, status: "unknown" },
            { name: "CARTWRIGHT MEGAN", level: "FSM", new_pod: 8, goal: 22, pct: 36, status: "behind" },
            { name: "GAGNELIUS WESLEY", level: "FSM", new_pod: 8, goal: 18, pct: 44, status: "behind" },
            { name: "TAPPAN CHARLES", level: "FSM", new_pod: 8, goal: 16, pct: 50, status: "behind" },
            { name: "HARTMANN CHRISTIAN", level: "FSM", new_pod: 7, goal: 15, pct: 47, status: "behind" },
            { name: "DRUASH KENDALL", level: "FSM", new_pod: 7, goal: 15, pct: 47, status: "behind" }
        ];

        // Render table
        document.getElementById('tableBody').innerHTML = reps.map((r, i) => {
            const color = r.status === 'exceeding' ? 'bg-green-500/20 text-green-400' : r.status === 'ontrack' ? 'bg-blue-500/20 text-blue-400' : r.status === 'behind' ? 'bg-red-500/20 text-red-400' : 'bg-slate-500/20 text-slate-400';
            return `<tr class="hover:bg-slate-800/50 transition">
                <td class="px-6 py-4">#${i + 1}</td>
                <td class="px-6 py-4 font-medium">${r.name}</td>
                <td class="px-6 py-4 text-slate-400">${r.level}</td>
                <td class="px-6 py-4">${r.new_pod}</td>
                <td class="px-6 py-4 text-slate-400">${r.goal || '-'}</td>
                <td class="px-6 py-4">${r.pct}%</td>
                <td class="px-6 py-4"><span class="px-2 py-1 rounded-full text-xs ${color}">${r.status}</span></td>
            </tr>`;
        }).join('');

        // Charts
        new Chart(document.getElementById('trendChart'), {
            type: 'line',
            data: { labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'], datasets: [{ label: 'New POD', data: [180, 210, 240, 264], borderColor: '#22c55e', backgroundColor: 'rgba(34,197,94,0.1)', fill: true, tension: 0.4 }] },
            options: { responsive: true, maintainAspectRatio: false }
        });

        new Chart(document.getElementById('statusChart'), {
            type: 'doughnut',
            data: { labels: ['Behind', 'On Track', 'Exceeding', 'Unknown'], datasets: [{ data: [21, 89, 0, 34], backgroundColor: ['#ef4444', '#3b82f6', '#22c55e', '#64748b'] }] },
            options: { responsive: true, maintainAspectRatio: false, cutout: '70%' }
        });

        // Export
        function exportCSV() {
            const csv = [['Rank', 'Rep', 'Level', 'New POD', 'Goal', '% to Goal'].join(','), ...reps.map((r, i) => [i + 1, r.name, r.level, r.new_pod, r.goal, r.pct + '%'].join(','))].join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'scout_report.csv';
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
