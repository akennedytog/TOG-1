<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Header Image</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    .header-container {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #8b5cf6 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px;
    }
    
    /* Animated grid background */
    .header-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridMove 20s linear infinite;
    }
    
    @keyframes gridMove {
      0% { transform: translate(0, 0); }
      100% { transform: translate(50px, 50px); }
    }
    
    /* Floating particles */
    .particles {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
    }
    
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255,255,255,0.3);
      border-radius: 50%;
      animation: float 15s infinite;
    }
    
    .particle:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; }
    .particle:nth-child(2) { left: 20%; top: 80%; animation-delay: 2s; }
    .particle:nth-child(3) { left: 30%; top: 40%; animation-delay: 4s; }
    .particle:nth-child(4) { left: 50%; top: 10%; animation-delay: 6s; }
    .particle:nth-child(5) { left: 70%; top: 60%; animation-delay: 8s; }
    .particle:nth-child(6) { left: 85%; top: 30%; animation-delay: 10s; }
    .particle:nth-child(7) { left: 90%; top: 70%; animation-delay: 12s; }
    .particle:nth-child(8) { left: 5%; top: 50%; animation-delay: 14s; }
    
    @keyframes float {
      0%, 100% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100px) translateX(50px);
        opacity: 0;
      }
    }
    
    /* Glow effect */
    .glow {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(139,92,246,0.4) 0%, transparent 70%);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: pulse 4s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
      50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; }
    }
    
    /* Content */
    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      color: white;
    }
    
    .badge {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 10px 24px;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 30px;
    }
    
    .badge::before {
      content: '🤖';
      margin-right: 8px;
    }
    
    h1 {
      font-size: 72px;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 20px;
      text-shadow: 0 4px 30px rgba(0,0,0,0.3);
      background: linear-gradient(to right, #ffffff, #e0e7ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .subtitle {
      font-size: 32px;
      font-weight: 400;
      opacity: 0.9;
      max-width: 900px;
      line-height: 1.4;
    }
    
    .stats {
      display: flex;
      gap: 60px;
      margin-top: 50px;
      justify-content: center;
    }
    
    .stat {
      text-align: center;
    }
    
    .stat-number {
      font-size: 56px;
      font-weight: 800;
      background: linear-gradient(to right, #fcd34d, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .stat-label {
      font-size: 16px;
      opacity: 0.7;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 5px;
    }
    
    /* Agent icons */
    .agent-icons {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      opacity: 0.6;
    }
    
    .agent-icon {
      width: 50px;
      height: 50px;
      background: rgba(255,255,255,0.1);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    
    /* Corner accents */
    .corner {
      position: absolute;
      width: 150px;
      height: 150px;
      border: 2px solid rgba(255,255,255,0.1);
    }
    
    .corner-tl { top: 30px; left: 30px; border-right: none; border-bottom: none; }
    .corner-tr { top: 30px; right: 30px; border-left: none; border-bottom: none; }
    .corner-bl { bottom: 30px; left: 30px; border-right: none; border-top: none; }
    .corner-br { bottom: 30px; right: 30px; border-left: none; border-top: none; }
    
    /* Logo watermark */
    .watermark {
      position: absolute;
      top: 30px;
      right: 40px;
      font-size: 20px;
      font-weight: 700;
      opacity: 0.3;
      letter-spacing: 3px;
    }
  </style>
</head>
<body>
  <div class="header-container">
    <div class="glow"></div>
    <div class="particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>
    
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
    
    <div class="watermark">THE ONE GROUP</div>
    
    <div class="content">
      <div class="badge">AI Automation</div>
      <h1>The OpenClaw Advantage</h1>
      <p class="subtitle">How AI Agents Are Replacing Your Dev Team (And Why That's Good)</p>
      
      <div class="stats">
        <div class="stat">
          <div class="stat-number">50</div>
          <div class="stat-label">GitHub Agents</div>
        </div>
        <div class="stat">
          <div class="stat-number">∞</div>
          <div class="stat-label">Possibilities</div>
        </div>
      </div>
    </div>
    
    <div class="agent-icons">
      <div class="agent-icon">⚡</div>
      <div class="agent-icon">🔧</div>
      <div class="agent-icon">🚀</div>
      <div class="agent-icon">📊</div>
      <div class="agent-icon">🔐</div>
    </div>
  </div>
</body>
</html>
