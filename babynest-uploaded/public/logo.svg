    <!-- Head outline -->
    <circle cx="42" cy="48" r="22"/>
    <!-- Hair swirl -->
    <path d="M42 26 Q52 20 50 32"/>
    <!-- Left eye -->
    <circle cx="35" cy="44" r="2.5" fill="white" stroke="none"/>
