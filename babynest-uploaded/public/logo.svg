  <path d="M78 30 L71.5 23.5 C69 21 69 17.5 71.5 15 C74 12.5 77.5 12.5 80 15 L78 17 L76 15 C73.5 12.5 77 12.5 79.5 15 L84.5 20 C87 22.5 87 26 84.5 28.5 L78 35" fill="white" transform="scale(0.6) translate(52 8)"/>
  <path d="M78 28 C72 22 72 16 78 14 C84 16 84 22 78 28" fill="white" transform="scale(0.5) translate(78 16)"/>
</svg>