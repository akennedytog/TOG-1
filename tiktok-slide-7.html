<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Slide 7 - CTA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 1080px;
            height: 1920px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }
        .glow {
            position: absolute;
            width: 1000px;
            height: 1000px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.3) 0%, rgba(139, 92, 246, 0.2) 40%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .content {
            text-align: center;
            z-index: 1;
            padding: 60px;
            width: 100%;
        }
        .emoji {
            font-size: 120px;
            margin-bottom: 60px;
        }
        .link-badge {
            display: inline-block;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            color: #ffffff;
            font-size: 48px;
            font-weight: 800;
            padding: 30px 70px;
            border-radius: 60px;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 80px;
            box-shadow: 0 20px 60px rgba(59, 130, 246, 0.5);
        }
        .url-box {
            background: rgba(30, 41, 59, 0.9);
            border: 3px solid rgba(139, 92, 246, 0.5);
            border-radius: 30px;
            padding: 50px 70px;
            margin-bottom: 100px;
        }
        .url {
            font-size: 48px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 2px;
        }
        .url span {
            color: #8b5cf6;
        }
        .closing {
            font-size: 72px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 60px;
        }
        .closing span {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .arrow {
            font-size: 100px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(30px); }
        }
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: rgba(59, 130, 246, 0.4);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }
        .particle:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; }
        .particle:nth-child(2) { left: 80%; top: 30%; animation-delay: 1s; }
        .particle:nth-child(3) { left: 20%; top: 70%; animation-delay: 2s; }
        .particle:nth-child(4) { left: 70%; top: 80%; animation-delay: 3s; }
        .particle:nth-child(5) { left: 50%; top: 10%; animation-delay: 4s; }
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.4; }
            50% { transform: translateY(-40px) scale(1.2); opacity: 0.8; }
        }
    </style>
</head>
<body>
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>
    <div class="glow"></div>
    <div class="content">
        <div class="emoji">🔗</div>
        <div class="link-badge">Link in Bio</div>
        <div class="url-box">
            <div class="url">theonegroup.info/<span>ai-agent-workshop</span></div>
        </div>
        <div class="closing">See You <span>There!</span></div>
        <div class="arrow">👇</div>
    </div>
</body>
</html>
