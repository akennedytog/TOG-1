<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="natureGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E9"/>
      <stop offset="100%" style="stop-color:#C8E6C9"/>
    </linearGradient>
  </defs>
  
  <!-- Main background -->
  <rect width="1000" height="1500" fill="url(#natureGrad)"/>
  
  <!-- Image placeholder area -->
  <rect x="50" y="50" width="900" height="1000" fill="#A5D6A7" rx="8"/>
  
  <!-- Decorative leaf/circle element -->
  <circle cx="850" cy="150" r="40" fill="#66BB6A" opacity="0.5"/>
  <circle cx="900" cy="200" r="25" fill="#43A047" opacity="0.3"/>
  
  <!-- Pin title -->
  <text x="50" y="1220" font-family="Montserrat, Arial, sans-serif" font-size="64" font-weight="600" fill="#1B5E20">
    Pin Title Here
  </text>
  
  <!-- Description text -->
  <text x="50" y="1300" font-family="Source Sans Pro, Arial, sans-serif" font-size="32" fill="#2E7D32">
    Description of your pin content
  </text>
  
  <!-- Website URL placeholder -->
  <text x="50" y="1420" font-family="Source Sans Pro, Arial, sans-serif" font-size="24" fill="#43A047">
    yourwebsite.com
  </text>
</svg>