<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canva Template Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      color: #333;
      background: #fff;
    }

    .container {
      padding: 16px;
      max-width: 400px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      padding: 16px 0 24px;
      border-bottom: 1px solid #E5E5E5;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #1A1A1A;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 12px;
      color: #666;
    }

    .section {
      margin-bottom: 20px;
    }

    .section h2 {
      font-size: 12px;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .template-grid,
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .card {
      border: 1px solid #E5E5E5;
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s;
      background: #FAFAFA;
    }

    .card:hover {
      border-color: #007BFF;
      background: #F0F7FF;
    }

    .card.selected {
      border-color: #007BFF;
      background: #007BFF;
      color: white;
    }

    .card.selected .card-title,
    .card.selected .card-dims {
      color: white;
    }

    .card-icon {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 12px;
      font-weight: 600;
      color: #333;
      margin-bottom: 2px;
    }

    .card-dims {
      font-size: 10px;
      color: #999;
    }

    .color-preview {
      display: flex;
      gap: 2px;
      margin-bottom: 8px;
      height: 20px;
      border-radius: 4px;
      overflow: hidden;
    }

    .color-swatch {
      flex: 1;
      height: 100%;
    }

    /* Theme color previews */
    .modern .color-swatch:nth-child(1) { background: #FFFFFF; }
    .modern .color-swatch:nth-child(2) { background: #007BFF; }
    .modern .color-swatch:nth-child(3) { background: #28A745; }
    .modern .color-swatch:nth-child(4) { background: #333333; }

    .minimal .color-swatch:nth-child(1) { background: #FFFFFF; }
    .minimal .color-swatch:nth-child(2) { background: #E0E0E0; }
    .minimal .color-swatch:nth-child(3) { background: #616161; }
    .minimal .color-swatch:nth-child(4) { background: #000000; }

    .bold .color-swatch:nth-child(1) { background: #1A1A2E; }
    .bold .color-swatch:nth-child(2) { background: #E94560; }
    .bold .color-swatch:nth-child(3) { background: #F39422; }
    .bold .color-swatch:nth-child(4) { background: #FFFFFF; }

    .corporate .color-swatch:nth-child(1) { background: #F8F9FA; }
    .corporate .color-swatch:nth-child(2) { background: #0066CC; }
    .corporate .color-swatch:nth-child(3) { background: #495057; }
    .corporate .color-swatch:nth-child(4) { background: #212529; }

    .creative .color-swatch:nth-child(1) { background: #FF6B6B; }
    .creative .color-swatch:nth-child(2) { background: #4ECDC4; }
    .creative .color-swatch:nth-child(3) { background: #FFEAA7; }
    .creative .color-swatch:nth-child(4) { background: #DDA0DD; }

    .elegant .color-swatch:nth-child(1) { background: #FAF9F6; }
    .elegant .color-swatch:nth-child(2) { background: #D4AF37; }
    .elegant .color-swatch:nth-child(3) { background: #C0C0C0; }
    .elegant .color-swatch:nth-child(4) { background: #2C2C2C; }

    .playful .color-swatch:nth-child(1) { background: #FF9FF3; }
    .playful .color-swatch:nth-child(2) { background: #FECA57; }
    .playful .color-swatch:nth-child(3) { background: #FF6B6B; }
    .playful .color-swatch:nth-child(4) { background: #48DBFB; }

    .text-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #E5E5E5;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
    }

    .text-input:focus {
      outline: none;
      border-color: #007BFF;
    }

    .export-buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      padding: 12px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-primary {
      background: #007BFF;
      color: white;
    }

    .btn-primary:hover {
      background: #0056B3;
    }

    .btn-primary:disabled {
      background: #CCC;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #F8F9FA;
      color: #333;
      border: 1px solid #E5E5E5;
    }

    .btn-secondary:hover {
      background: #E9ECEF;
    }

    .status {
      display: none;
      padding: 12px;
      border-radius: 6px;
      margin-top: 16px;
      font-size: 12px;
    }

    .status.info {
      background: #E3F2FD;
      color: #1565C0;
      border: 1px solid #BBDEFB;
    }

    .status.success {
      background: #E8F5E9;
      color: #2E7D32;
      border: 1px solid #C8E6C9;
    }

    .status.error {
      background: #FFEBEE;
      color: #C62828;
      border: 1px solid #FFCDD2;
    }

    .footer {
      text-align: center;
      padding-top: 20px;
      border-top: 1px solid #E5E5E5;
      margin-top: 20px;
    }

    .footer p {
      font-size: 11px;
      color: #999;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="ui.js"></script>
</body>
</html>
