<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Slide 6 - Learning</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 1080px;
            height: 1920px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }
        .glow {
            position: absolute;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.2) 0%, transparent 70%);
            top: 10%;
            right: -20%;
            pointer-events: none;
        }
        .glow-2 {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.2) 0%, transparent 70%);
            bottom: 10%;
            left: -20%;
            pointer-events: none;
        }
        .content {
            text-align: center;
            z-index: 1;
            padding: 60px;
            width: 100%;
        }
        .header {
            font-size: 56px;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 30px;
        }
        .title {
            font-size: 80px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 100px;
        }
        .title span {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .checklist {
            display: flex;
            flex-direction: column;
            gap: 40px;
            text-align: left;
            max-width: 900px;
            margin: 0 auto;
        }
        .check-item {
            display: flex;
            align-items: center;
            gap: 40px;
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
            border: 2px solid rgba(59, 130, 246, 0.2);
            border-radius: 25px;
            padding: 45px 50px;
            transition: all 0.3s ease;
        }
        .check-item:nth-child(2) {
            border-color: rgba(139, 92, 246, 0.3);
        }
        .check-item:nth-child(3) {
            border-color: rgba(168, 85, 247, 0.3);
        }
        .check-item:nth-child(4) {
            border-color: rgba(59, 130, 246, 0.3);
        }
        .check-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #ffffff;
            flex-shrink: 0;
        }
        .check-text {
            font-size: 44px;
            color: #e2e8f0;
            font-weight: 600;
            line-height: 1.3;
        }
        .bonus {
            margin-top: 80px;
            padding: 40px 60px;
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.15) 0%, rgba(34, 197, 94, 0.05) 100%);
            border: 2px solid rgba(34, 197, 94, 0.4);
            border-radius: 25px;
        }
        .bonus-text {
            font-size: 44px;
            color: #4ade80;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="glow-2"></div>
    <div class="content">
        <div class="header">What You'll Learn</div>
        <div class="title">In This <span>Workshop</span></div>
        <div class="checklist">
            <div class="check-item">
                <div class="check-icon">✓</div>
                <div class="check-text">Lead research automation</div>
            </div>
            <div class="check-item">
                <div class="check-icon">✓</div>
                <div class="check-text">Content creation workflows</div>
            </div>
            <div class="check-item">
                <div class="check-icon">✓</div>
                <div class="check-text">Email outreach sequences</div>
            </div>
            <div class="check-item">
                <div class="check-icon">✓</div>
                <div class="check-text">Agent coordination systems</div>
            </div>
        </div>
        <div class="bonus">
            <div class="bonus-text">+ Exclusive templates & resources</div>
        </div>
    </div>
</body>
</html>
